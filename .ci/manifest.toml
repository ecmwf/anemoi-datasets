[package]
name = "anemoi-datasets"
repo = "ecmwf/anemoi-datasets"
visibility = "public"
compiler-inputs = []

[[deps]]
repo = "ecmwf/anemoi-utils"
package = "anemoi-utils"
ref = "main"
compiler-inputs = []
python-version-input = "python-version"

[[deps]]
repo = "ecmwf/anemoi-transform"
package = "anemoi-transform"
ref = "main"
compiler-inputs = []
python-version-input = "python-version"

# Each leg publishes its wheel, so a consumer's leg takes the one tested on
# its own Python (python-version-input).
[matrix.test]
triggers = ["upstream-change", "rebuild-request"]

[matrix.test.defaults]
job-script = "./.ci/test.sh.j2"
runs-on = "ubuntu-24.04"
platform = "gh-ubuntu-24.04"
extras = "all,tests"
pytest-args = "--durations=25"

[[matrix.test.include]]
python-version = "3.11"

[[matrix.test.include]]
python-version = "3.12"

[[matrix.test.include]]
python-version = "3.13"

# zarr 2 compatibility: the `zarr2` extra pins zarr, numcodecs and xarray to
# their last zarr 2 versions. A test kind only: its wheel is the test leg's, and
# publishing it would clash with that leg's artifact name.
[matrix.zarr2]
publishes = false

[[matrix.zarr2.include]]
job-script = "./.ci/test.sh.j2"
runs-on = "ubuntu-24.04"
platform = "gh-ubuntu-24.04"
python-version = "3.13"
extras = "all,tests,zarr2"

[[trigger-downstream]]
repo = "ecmwf/anemoi-core"
ref = "main"

[[trigger-downstream]]
repo = "ecmwf/anemoi-inference"
ref = "main"
