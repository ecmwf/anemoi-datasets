# This workflow runs pre-commit checks and pytest tests against multiple platforms and Python versions.
name: Test against PyPI

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches:
      - main
  schedule:
    - cron: "9 2 * * 0" # at 9:02 on sunday

jobs:
  quality:
    uses: ecmwf/reusable-workflows/.github/workflows/qa-precommit-run.yml@v2
    with:
      skip-hooks: "no-commit-to-branch"

  checks:
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    uses: ecmwf/reusable-workflows/.github/workflows/qa-pytest-pyproject.yml@v2
    with:
      python-version: ${{ matrix.python-version }}
      # 6 xdist workers on 4 vCPUs, as in .ci/manifest.toml: the tests mostly wait on I/O.
      custom-pytest: pytest -n 6

  zarr2-compatibility:
    uses: ecmwf/reusable-workflows/.github/workflows/qa-pytest-pyproject.yml@v2
    with:
      python-version: "3.13"
      optional-dependencies: "all,tests,zarr2"
      custom-pytest: pytest -n 6
