# This workflow runs pre-commit checks and pytest tests against multiple platforms and Python versions.
name: Code Quality and Testing

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches:
      - main
  schedule:
    - cron: "9 2 * * 0" # at 9:02 on sunday

jobs:
  quality:
    uses: ecmwf/reusable-workflows/.github/workflows/qa-precommit-run.yml@v2
    with:
      skip-hooks: "no-commit-to-branch"

  checks:
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    uses: ecmwf/reusable-workflows/.github/workflows/qa-pytest-pyproject.yml@v2
    with:
      python-version: ${{ matrix.python-version }}
      # Expose the odc binary bundled in the odclib wheel (and the eckit libraries
      # it links against) so that tests needing the `odc` command are not skipped.
      custom-pytest: >-
        SITE=$(python -c "import sysconfig; print(sysconfig.get_paths()['purelib'])");
        export PATH="$SITE/odclib/bin:$PATH";
        export LD_LIBRARY_PATH="$SITE/eckitlib/lib64:$SITE/eckitlib.libs:$SITE/odclib/lib64:$LD_LIBRARY_PATH";
        pytest -rs
