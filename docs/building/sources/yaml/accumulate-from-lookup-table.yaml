accumulate:
  period: 6h
  from-lookup-table:
    start: 1970-01-01        # reference anchoring the cycle phase;
                             # cycle length = largest key end = 24h
    "0-6": [18, "6-12"]      # window 00->06: yesterday's 18Z run, steps 6-12
    "6-12": [18, "12-18"]    # window 06->12: steps 12-18
    "12-18": [18, "18-24"]   # window 12->18: steps 18-24
    "18-24": [18, "0-6"]     # window 18->24: today's 18Z run, steps 0-6
  source:
    mars:
      class: rd
      expver: xxxx
      type: fc
      levtype: sfc
      param: [tp]
