description: >-
  Trajectory dataset built from MET Norway MEPS 2.5 km deterministic surface
  forecasts. Each NetCDF file holds one forecast run (named by its
  forecast_reference_time) with hourly validity steps; the file is selected from
  the basetime and the step is recovered as valid_time - basetime. Instantaneous
  fields are sampled on a 2 h step grid; the flux fields (tp, ssrd, strd), stored
  as 1 h increments, are re-accumulated to the 2 h step with the accumulate block.
attribution: Norwegian Meteorological Institute (MET Norway)
licence: https://www.met.no/en/free-meteorological-data

# One trajectory per forecast run. Runs are 18 h apart (00, 18, 12, 06, ...),
# so a new run starts every 18 hours across the period.
base_dates:
  start: 2025-01-01 00:00:00
  end: 2025-01-31 18:00:00
  frequency: 18h

# 2 h forecast lead times within each run (steps 2, 4, …, 16 h). Step 0 (the
# reference time) is not a forecast lead time and is excluded.
steps:
  start: 2
  end: 16
  frequency: 2h

input:
  join:
    # Instantaneous fields, sampled at the 2 h step grid. The {base_date}
    # placeholder is filled with the forecast basetime (one file per run).
    - netcdf:
        path: /etc/ecmwf/nfs/dh1_home_a/mafp/work/trajectories-fix/anemoi-datasets/metno-data/{base_date:strftime(%Y%m%dT%H)}Z.nc
        param: [10u, 10v, 2t, 2d, sp, msl]

    # Accumulated flux fields. The files store 1 h increments (source_period),
    # which are summed over each 2 h step window (from-previous-step).
    - accumulate:
        period: 2h
        source_period: 1h
        accumulation: from-previous-step
        source:
          netcdf:
            path: /etc/ecmwf/nfs/dh1_home_a/mafp/work/trajectories-fix/anemoi-datasets/metno-data/{base_date:strftime(%Y%m%dT%H)}Z.nc
            param: [tp, ssrd, strd]

output:
  layout: trajectories
