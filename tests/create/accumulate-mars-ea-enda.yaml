dates:
  frequency: 6h
  start: 2021-01-10 18:00:00
  end: 2021-01-12 12:00:00

# https://apps.ecmwf.int/mars-catalogue/?stream=oper&levtype=sfc&expver=1&month=aug&year=2020&type=fc&class=ea

input:
  accumulate:
    period: 6h

    from:
      base_dates: {times: ["06:00", "18:00"]}
      steps: {start: 3h, end: 18h, frequency: 3h}
      accumulation: 3h

    source:
      mars:
        number: 0
        expver: "0001"
        class: ea
        type: fc
        stream: enda
        grid: 20./20.
        levtype: sfc
        param: [ tp, cp ]

checks:
  none: {}
