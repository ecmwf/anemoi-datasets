dates:
  frequency: 6h
  start: 2021-01-10 18:00:00
  end: 2021-01-12 12:00:00

# https://apps.ecmwf.int/mars-catalogue/?stream=oper&levtype=sfc&expver=1&month=aug&year=2020&type=fc&class=ea
# time : 6 18
# step : 0/to/18/by/1

input:
  accumulate:
    period: 6h
    # same as from-trajectories: auto for this class/stream
    from-trajectories:
      base_dates: {times: ["06:00", "18:00"]}
      steps: {start: 0h, end: 18h, frequency: 1h}
      accumulated: from-previous-step

    source:
      mars:
        expver: "0001"
        class: ea
        type: fc
        grid: 20./20.
        levtype: sfc
        param: [tp, cp]

checks:
  none: {}
