dates:
  frequency: 24h
  start: 2021-01-10 6:00:00
  end: 2021-01-12 0:00:00

input:
  accumulate:
    period: 1h
    from-trajectories: auto
      # equivalent to the explicit description:
      #   base_dates: {times: ["06:00", "18:00"]}
      #   steps: {start: 0h, end: 18h, frequency: 1h}
      #   accumulated: from-previous-step
    source:
      mars:
        expver: "0001"
        class: ea
        type: fc
        stream: oper
        #stream: enda
        grid: 20./20.
        levtype: sfc
        param: [ tp, cp ]
    group_by:
      namespace: 'mars'
      ignore: ['date','time','step','timespan']

checks:
  none: {}
