dates:
  #start: 1979-01-01 00:00:00
  #end: 2024-12-31 18:00:00
  start: 2020-01-01 00:00:00
  end: 2020-01-03 00:00:00
  frequency: 6h

input:
    accumulate:
     period: 6h
     from-trajectories:
       base_dates: {times: ["00:00"]}
       steps: {start: 0h, end: 24h, frequency: 6h}
       accumulated: from-previous-step
     source:
      mars:
       expver: isc8
       grid: 20./20.
       levtype: sfc
       time: 0
       type: fc
       class: rd
       param: [ro, e, sshf, slhf, strd, ssrd, ssr, str, tp, sf]


statistics:
  allow_nans: True

checks:
   compare_to_reference: {}
