dates:
  frequency: 6h
  start: 2014-06-02 00:00:00
  end: 2014-06-02 06:00:00

# https://apps.ecmwf.int/mars-catalogue/?stream=oper&levtype=sfc&expver=1&month=aug&year=2020&type=fc&class=ea
# time : 6 18
# step : 0/to/18/by/1

input:
  accumulate:
    period: 1h

    from-trajectories:
      # monthly research runs: one 00Z run on the 1st of each month,
      # hourly steps out to 720h, accumulated from zero but the DATA
      # resets every 24h of lead time
      base_dates:
        times: ["00:00"]
        day_of_month: 1
      steps: {start: 0h, end: 720h, frequency: 1h}
      accumulated: from-zero-reset-every-24h

    patch:
      # because the data wrongly encode start_step as 0 even after 24
      - reset_24h_accumulations

    source:
      mars:
        class: rd
        stream: oper
        type: fc
        expver: i6aj
        # grid: o400
        grid: 20./20.
        levtype: sfc
        #param:
        #- slhf
        #- sshf
        #- aco2gpp
        #- aco2nee
        #- aco2rec
        param: [tp]
        # param: [aco2gpp]
        # param: [81.228] -> need to add use_grib_paramid
        number: 0
        # param: [81.228, 80.228, 82.228, 147, 146]

build:
   use_grib_paramid: True

statistics:
  allow_nans: True

checks:
  none: {}
