dates:
  frequency: 3h
  start: 2021-01-10 18:00:00
  end: 2021-01-12 12:00:00

#  inspired by: https://anemoi.ecmwf.int/datasets/cerra-rr-an-oper-se-al-ec-mars-5p5km-1985-2023-3h-v2?tab=recipe

input:
  accumulate:
    period: 3h
    from-trajectories:
      base_dates:
        times: ["00:00", "03:00", "06:00", "09:00", "12:00", "15:00", "18:00", "21:00"]
      steps: {start: 3h, end: 3h, frequency: 3h}
      accumulated: from-zero
    source:
      mars:
        class: rr
        stream: oper
        expver: prod
        origin: se-al-ec
        levtype: sfc
        type: fc
        param: ["tp","ssrd","strd"]
        grid: 20./20.

statistics:
  allow_nans: [ssrd, ci]

checks:
  none: {}
